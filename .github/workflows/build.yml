name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: pk-qr-linux-x86_64
          - name: macos-arm64
            os: macos-latest
            artifact: pk-qr-macos-arm64
          - name: windows-x86_64
            os: windows-latest
            artifact: pk-qr-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Test
        run: zig build test

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: zig-out/bin/*
          if-no-files-found: error
